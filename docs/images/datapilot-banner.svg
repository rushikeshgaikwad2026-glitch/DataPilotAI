    <rect x="760" y="246" width="356" height="111" rx="12" fill="#fff" stroke="#e8ecf4"/>
    <text x="778" y="268" fill="#17213b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Revenue trend</text>
    <text x="778" y="284" fill="#8290aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Weekly total · illustrative sample</text>
    <g stroke="#edf1f7" stroke-width="1">
      <path d="M780 310h318M780 329h318M780 348h318"/>
    </g>
    <path d="M785 340 830 330 875 336 920 313 965 320 1010 294 1054 301 1092 278" fill="none" stroke="#435bc0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M785 340 830 330 875 336 920 313 965 320 1010 294 1054 301 1092 278V349H785Z" fill="#6675e8" opacity=".10"/>
    <g fill="#435bc0">
      <circle cx="785" cy="340" r="3.5"/><circle cx="830" cy="330" r="3.5"/><circle cx="875" cy="336" r="3.5"/><circle cx="920" cy="313" r="3.5"/>
      <circle cx="965" cy="320" r="3.5"/><circle cx="1010" cy="294" r="3.5"/><circle cx="1054" cy="301" r="3.5"/><circle cx="1092" cy="278" r="3.5"/>
    </g>

    <rect x="1130" y="246" width="220" height="111" rx="12" fill="#fff" stroke="#e8ecf4"/>
    <text x="1148" y="268" fill="#17213b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Revenue by region</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" fill="#65728b">
      <text x="1148" y="291">North</text><text x="1148" y="310">West</text><text x="1148" y="329">South</text><text x="1148" y="348">East</text>
    </g>
    <g>
      <rect x="1192" y="283" width="112" height="10" rx="5" fill="#b9c9fa"/>
      <rect x="1192" y="302" width="119" height="10" rx="5" fill="#6675e8"/>
      <rect x="1192" y="321" width="115" height="10" rx="5" fill="#91a3f4"/>
      <rect x="1192" y="340" width="120" height="10" rx="5" fill="#344b9c"/>
